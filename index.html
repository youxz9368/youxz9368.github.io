<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的 HTTPS 托管地址</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.15);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }
    p {
      margin: 0;
      opacity: 0.9;
    }
    a {
      color: #fff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✅ HTTPS 托管成功</h1>
    <p>这是我的 GitHub Pages 地址</p>
    <p style="margin-top:12px;">
      <a id="url" href=""></a>
    </p>
  </div>

  <script>
    document.getElementById("url").innerText = location.href;
    document.getElementById("url").href = location.href;
  </script>
</body>
</html>
