<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="棋斗士">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>棋斗士</title>
<style>
:root{
  --bg:#0f172a;
  --bg2:#1b2a4a;
  --card:#1e2c4f;
  --card2:#27386b;
  --ink:#eaf0ff;
  --sub:#9fb0d0;
  --gold:#f5c96b;
  --gold2:#e0a94a;
  --red:#ef5350;
  --green:#66bb6a;
  --blue:#4f8cff;
  --line:rgba(255,255,255,.08);
  --radius:16px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 800px at 50% -10%, #24365f 0%, var(--bg) 55%);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:74px}
/* header */
header{
  position:sticky;top:0;z-index:20;
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.78));
  backdrop-filter:blur(8px);
}
.logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,#f5c96b,#e0a94a);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;color:#1b2a4a;
  box-shadow:0 4px 14px rgba(245,201,107,.35);
}
header h1{font-size:21px;margin:0;letter-spacing:2px}
header h1 b{color:var(--gold)}
header .sub{font-size:11px;color:var(--sub);letter-spacing:1px}
/* pages */
.page{display:none;padding:14px 14px 20px;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-title{font-size:18px;font-weight:700;margin:4px 4px 12px;display:flex;align-items:center;gap:8px}
.page-title .bar{width:4px;height:18px;background:var(--gold);border-radius:2px}
.page-title .tip{font-size:11px;color:var(--sub);font-weight:400;margin-left:auto}
/* cards */
.grid{display:grid;gap:12px}
.grid.cols2{grid-template-columns:1fr 1fr}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .12s ease,border-color .12s ease;
}
.card:active{transform:scale(.97)}
.card:hover{border-color:rgba(245,201,107,.5)}
.card .ic{font-size:26px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:16px}
.card p{margin:0;font-size:12px;color:var(--sub);line-height:1.6}
.card .tag{position:absolute;top:10px;right:10px;font-size:10px;color:#1b2a4a;background:var(--gold);padding:2px 8px;border-radius:20px;font-weight:700}
.chip{display:inline-block;font-size:11px;color:var(--gold);border:1px solid rgba(245,201,107,.4);padding:2px 8px;border-radius:20px;margin:6px 4px 0 0}
/* section */
.section{margin:16px 0 6px}
.section h2{font-size:15px;margin:0 4px 10px;color:var(--gold);letter-spacing:1px}
/* bottom nav */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:520px;z-index:30;
  display:flex;background:rgba(18,26,46,.98);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav .nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;color:var(--sub);font-size:10px;cursor:pointer;border:none;background:none;border-radius:10px}
nav .nv .i{font-size:20px;line-height:1}
nav .nv.on{color:var(--gold)}
nav .nv.on .i{transform:translateY(-2px)}
/* overlay (detail / game) */
#overlay{
  position:fixed;inset:0;z-index:40;display:none;
  background:var(--bg);flex-direction:column;
}
#overlay.show{display:flex}
.ov-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.ov-head .back{width:38px;height:38px;border-radius:10px;background:var(--card2);border:none;color:var(--ink);font-size:18px;cursor:pointer;flex:0 0 auto}
.ov-head h2{font-size:17px;margin:0;flex:1}
.ov-body{flex:1;overflow-y:auto;padding:14px;max-width:560px;margin:0 auto;width:100%}
/* rules text */
.rules{padding:6px 2px}
.rules h3{font-size:15px;color:var(--gold);margin:18px 0 8px}
.rules p{font-size:13.5px;line-height:1.85;color:var(--ink);margin:6px 0}
.rules ul{margin:6px 0;padding-left:18px}
.rules li{font-size:13.5px;line-height:1.8;margin:4px 0}
.rules .note{background:var(--card);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:12.5px;color:var(--sub);margin:12px 0}
.board-wrap{display:flex;justify-content:center;margin:14px 0}
.board-wrap svg{width:100%;max-width:360px;height:auto;border-radius:10px;box-shadow:var(--shadow)}
/* buttons */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b2a4a;letter-spacing:1px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;display:inline-block;padding:8px 16px;font-size:13px}
.btn.red{background:linear-gradient(135deg,#ef5350,#d32f2f);color:#fff}
.btn.green{background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.mdl{background:var(--bg2);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 24px;border-top:1px solid var(--line)}
.mdl h3{margin:0 0 14px;font-size:17px;color:var(--gold)}
.mdl .row{margin-bottom:14px}
.mdl .row label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;cursor:pointer}
.seg button.on{background:var(--gold);color:#1b2a4a;border-color:var(--gold);font-weight:700}
/* game panel */
.game-stage{display:flex;flex-direction:column;gap:10px;align-items:center}
.game-bar{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.game-bar .pl{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.3)}
canvas.game{background:#111c36;border-radius:12px;box-shadow:var(--shadow);touch-action:manipulation;display:block;max-width:100%}
.game-msg{min-height:20px;font-size:13px;color:var(--gold);text-align:center}
.game-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* polygon puzzle */
.poly-wrap{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.poly-target-bar{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:14px;color:var(--gold)}
.poly-palette{width:100%;max-width:420px;height:90px;background:#111c36;border-radius:12px;border:1px solid var(--line);display:block;touch-action:manipulation}
.poly-board{width:100%;max-width:420px;height:360px;background:#0b1226;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);display:block;touch-action:none}
.poly-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.poly-piece{stroke:#1b2a4a;stroke-width:1.5;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.poly-piece.sel{stroke:var(--gold);stroke-width:3}
.poly-palette-piece{stroke:#1b2a4a;stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.target-layer{pointer-events:none}
/* formula card */
.fml{background:var(--card);border-radius:12px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.fml .t{font-weight:700;color:var(--gold);margin-bottom:6px}
.fml code{font-family:Consolas,monospace;font-size:13px;color:#8fd3ff;line-height:1.7;display:block;background:#0d1730;padding:10px;border-radius:8px;white-space:pre-wrap}
/* about */
.about{text-align:center;padding:10px 4px}
.about .biglogo{width:88px;height:88px;margin:6px auto 14px;border-radius:24px;background:linear-gradient(135deg,#f5c96b,#e0a94a);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#1b2a4a;box-shadow:0 10px 30px rgba(245,201,107,.35)}
.about h2{font-size:26px;margin:0 0 4px;letter-spacing:4px}
.about .kv{background:var(--card);border-radius:12px;padding:12px;margin:10px 0;text-align:left;border:1px solid var(--line)}
.about .kv .k{color:var(--sub);font-size:12px;margin-bottom:4px}
.about .kv .v{font-size:15px;font-weight:600}
.about .desc{font-size:13px;color:var(--sub);line-height:1.9;text-align:left;background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line)}
.about .desc b{color:var(--gold)}
.qr{width:200px;height:200px;margin:12px auto;display:block;border-radius:12px;border:1px solid var(--line);background:#fff;object-fit:cover}
.qr-caption{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
.scroll-tip{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">棋</div>
    <div>
      <h1>棋<b>斗</b>士</h1>
      <div class="sub">QIDOUSHI · 掌上棋类益智大全</div>
    </div>
  </header>

  <!-- 页面1：棋类介绍 -->
  <section class="page active" id="page-1">
    <div class="page-title"><span class="bar"></span>棋类介绍<span class="tip">12 种棋 · 点击查看棋盘与走法</span></div>
    <div class="grid" id="chess-grid"></div>
  </section>

  <!-- 页面2：人机对战 -->
  <section class="page" id="page-2">
    <div class="page-title"><span class="bar"></span>人机对战<span class="tip">6 款 · 可切换 我方 / AI / 双人</span></div>
    <div class="section"><h2>单人对战 AI 游戏</h2></div>
    <div class="grid cols2" id="game-grid"></div>
    <div class="rules note" style="margin:14px 4px 0">
      进入游戏前可设定 <b>对弈方</b>（AI 电脑 / 双人）与 <b>谁先走</b>。人机模式下由你执一方、电脑执另一方；双人模式适合两位玩家轮流落子。
    </div>
  </section>

  <!-- 页面3：益智说明 -->
  <section class="page" id="page-3">
    <div class="page-title"><span class="bar"></span>益智说明<span class="tip">8 项 · 玩法与走法介绍</span></div>
    <div class="grid" id="puzzle-grid"></div>
  </section>

  <!-- 页面4：休闲游戏 -->
  <section class="page" id="page-4">
    <div class="page-title"><span class="bar"></span>休闲游戏<span class="tip">5 款可玩</span></div>
    <div class="grid" id="play-grid"></div>
  </section>

  <!-- 页面5：关于 -->
  <section class="page" id="page-5">
    <div class="about" id="about-box"></div>
  </section>

  <nav>
    <button class="nv on" data-p="1"><span class="i">♟</span>棋类介绍</button>
    <button class="nv" data-p="2"><span class="i">⚔</span>人机对战</button>
    <button class="nv" data-p="3"><span class="i">🧩</span>益智说明</button>
    <button class="nv" data-p="4"><span class="i">🎮</span>休闲游戏</button>
    <button class="nv" data-p="5"><span class="i">ℹ</span>关于</button>
  </nav>
</div>

<!-- 详情/游戏浮层 -->
<div id="overlay">
  <div class="ov-head">
    <button class="back" id="ov-back">‹</button>
    <h2 id="ov-title"></h2>
  </div>
  <div class="ov-body" id="ov-body"></div>
</div>

<!-- 配置弹窗 -->
<div id="modal">
  <div class="mdl" id="modal-body"></div>
</div>

<script src="content.js"></script>
<script src="games.js"></script>
<script src="puzzles.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
<script>
// PWA：注册 Service Worker（仅 HTTPS / localhost 下生效，file:// 自动跳过）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) {
      console.warn('SW register failed:', e);
    });
  });
}
</script>
</body>
</html>
