<script>
(function(){
  "use strict";

  var FONTS = {
    kai:    '"KaiTi","STKaiti","楷体","Kaiti SC",serif',
    xk:     '"STXingkai","华文行楷","Xingkai SC","KaiTi",cursive',
    cao:    '"STXingcao","华文行草","行草","STXingkai","Cursive","KaiTi",cursive',
    li:     '"LiSu","隶书","LiSu SC","KaiTi",serif',
    xzhuan: '"方正小篆体","FZXiaoZhuanTi-S05S","汉仪篆书繁","HYShangWeiShouJ","ZhuanTi","篆体","STXinwei","KaiTi",serif',
    dzhuan: '"金文大篆体","JinWenDaZhuanTi","汉仪金文篆","HYJinWenKaiJ","ZhuanTi","篆体","STXinwei","KaiTi",serif',
    fs:     '"FangSong","仿宋","FangSong SC","KaiTi",serif',
    song:   '"SimSun","宋体","Songti SC",serif',
    yahei:  '"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif',
    hei:    '"SimHei","黑体","Heiti SC",sans-serif'
  };

  var NAME_LAYOUTS = {
    square: [["lay_sq_trad","右起竖读（传统）"],["lay_sq_h","横读（左→右，上→下）"]],
    rect:   [["lay_rect_v","竖排（上→下）"],["lay_rect_h","横排（左→右）"]],
    circle: [["lay_circle_arc","弧形排布 · 印在下"],["lay_circle_cross","十字四点 · 印在下"],["lay_circle_center","中印式 · 印居中"]]
  };

  var PAD = 130;

  var state = {
    mode: "name",
    name: "张三丰",
    order: ["张","三","丰","印"],
    nameShape: "square",
    nameLayout: "lay_sq_trad",
    font: FONTS.kai,
    hand: false,
    strokes: [[],[],[],[]],
    date: new Date(),
    dateFormat: "ch",
    dateShape: "square",
    color: "#C8281E",
    texture: true,
    bold: false
  };

  function F(size){ return (state.bold ? "bold " : "") + size + "px " + state.font; }

  function curShape(){ return state.mode === "name" ? state.nameShape : state.dateShape; }

  /* ---------- 工具：日期字符串 ---------- */
  function dateParts(d, fmt){
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    if (fmt === "ch") return [y + "年", m + "月" + day + "日"];
    var s = y + "." + m + "." + day;
    var half = Math.ceil(s.length / 2);
    return [s.slice(0, half), s.slice(half)];
  }
  function dateText(d, fmt){
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    return fmt === "ch" ? y + "年" + m + "月" + day + "日" : y + "." + m + "." + day;
  }

  /* ---------- 姓名：重建顺序 ---------- */
  function rebuildOrder(){
    var n = (state.name || "").replace(/\s/g, "");
    if (!n) n = "无名";
    var chars = n.split("");
    if (chars.length > 3) chars = chars.slice(0, 3);
    if (chars[chars.length - 1] !== "印") chars.push("印");
    state.order = chars;
  }

  /* ---------- 单字绘制（手写 / 字体） ---------- */
  function drawGlyph(ctx, i, x, y, box){
    var st = state.strokes[i];
    if (state.hand && st && st.length){
      ctx.save();
      ctx.translate(x - box/2, y - box/2);
      ctx.scale(box, box);
      ctx.strokeStyle = state.color; ctx.fillStyle = state.color;
      ctx.lineWidth = state.bold ? 0.104 : 0.078;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (var s=0; s<st.length; s++){
        var one = st[s];
        if (one.length === 1){
          ctx.beginPath(); ctx.arc(one[0].x, one[0].y, ctx.lineWidth*0.5, 0, Math.PI*2); ctx.fill();
          continue;
        }
        ctx.beginPath(); ctx.moveTo(one[0].x, one[0].y);
        for (var k=1; k<one.length; k++) ctx.lineTo(one[k].x, one[k].y);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
    ctx.fillText(state.order[i], x, y);
  }

  /* ---------- 姓名章：正方形 ---------- */
  function drawNameSquare(ctx, cx, cy, S){
    var border = S*0.042, half=S/2, x0=cx-half, y0=cy-half;
    ctx.strokeStyle=state.color; ctx.fillStyle=state.color; ctx.lineJoin="miter";
    ctx.lineWidth=border;
    ctx.strokeRect(x0+border/2, y0+border/2, S-border, S-border);
    ctx.lineWidth=border*0.5;
    ctx.beginPath();
    ctx.moveTo(cx, y0+border*0.9); ctx.lineTo(cx, y0+S-border*0.9);
    ctx.moveTo(x0+border*0.9, cy); ctx.lineTo(x0+S-border*0.9, cy);
    ctx.stroke();
    var cs=S*0.295; ctx.font=F(cs); ctx.textAlign="center"; ctx.textBaseline="middle";
    var pos = state.nameLayout==="lay_sq_h"
      ? [[0.265,0.265],[0.735,0.265],[0.265,0.735],[0.735,0.735]]
      : [[0.735,0.265],[0.735,0.735],[0.265,0.265],[0.265,0.735]];
    for (var i=0; i<state.order.length && i<4; i++){
      drawGlyph(ctx, i, x0+S*pos[i][0], y0+S*pos[i][1], cs*1.02);
    }
  }

  /* ---------- 姓名章：长方形 ---------- */
  function nameRectMetrics(S){
    var n=state.order.length, border=S*0.05;
    if (state.nameLayout==="lay_rect_h"){
      var cs=S*0.26;
      return {n:n, cs:cs, w:cs*1.24*n+border*2+S*0.05, h:cs+border*2+S*0.05, h:true, border:border};
    }
    var cs=S*0.44*0.58;
    return {n:n, cs:cs, w:S*0.44, h:cs*1.24*n+border*2+S*0.05, h:false, border:border};
  }
  function drawNameRect(ctx, cx, cy, S){
    var m=nameRectMetrics(S), n=m.n, cs=m.cs, W=m.w, H=m.h, border=m.border;
    var x0=cx-W/2, y0=cy-H/2;
    ctx.strokeStyle=state.color; ctx.fillStyle=state.color; ctx.lineWidth=border;
    ctx.strokeRect(x0+border/2, y0+border/2, W-border, H-border);
    ctx.font=F(cs); ctx.textAlign="center"; ctx.textBaseline="middle";
    var i;
    if (m.h){
      var innerL=x0+border, innerW=W-2*border;
      for (i=0;i<n;i++) drawGlyph(ctx, i, innerL+innerW*(i+0.5)/n, cy, cs*1.02);
      if (n>1){ ctx.lineWidth=border*0.45; ctx.beginPath(); for (var j=1;j<n;j++){ var xx=innerL+innerW*j/n; ctx.moveTo(xx,y0+border*0.8); ctx.lineTo(xx,y0+H-border*0.8); } ctx.stroke(); }
    } else {
      var innerTop=y0+border, innerH=H-2*border;
      for (i=0;i<n;i++) drawGlyph(ctx, i, cx, innerTop+innerH*(i+0.5)/n, cs*1.02);
      if (n>1){ ctx.lineWidth=border*0.45; ctx.beginPath(); for (var j=1;j<n;j++){ var yy=innerTop+innerH*j/n; ctx.moveTo(x0+border*0.8,yy); ctx.lineTo(x0+W-border*0.8,yy); } ctx.stroke(); }
    }
  }

  /* ---------- 姓名章：圆形 ---------- */
  function drawNameCircle(ctx, cx, cy, S){
    var R=S/2, border=S*0.038;
    ctx.strokeStyle=state.color; ctx.fillStyle=state.color;
    ctx.lineWidth=border;
    ctx.beginPath(); ctx.arc(cx,cy,R-border/2,0,Math.PI*2); ctx.stroke();
    var n=state.order.length;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    if (state.nameLayout==="lay_circle_arc"){
      var arcR=R*0.48, m=n-1; if (m<1) m=1;
      var step=Math.min(1.05,2.5/m), fsName=S*0.235, fsSeal=S*0.215;
      ctx.font=F(fsName);
      for (var i=0;i<m;i++){
        var th=((m-1)/2-i)*step;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(th); ctx.translate(0,-arcR); drawGlyph(ctx,i,0,0,fsName*1.04); ctx.restore();
      }
      ctx.font=F(fsSeal); drawGlyph(ctx,n-1,cx,cy+R*0.44,fsSeal*1.04);
    } else if (state.nameLayout==="lay_circle_cross"){
      var fs=S*0.235, slots=[[-R*0.46,0],[0,-R*0.46],[R*0.46,0]], m2=n-1;
      ctx.font=F(fs);
      for (var k=0;k<m2;k++) drawGlyph(ctx,k,cx+slots[k][0],cy+slots[k][1],fs*1.04);
      var fs2=S*0.26; ctx.font=F(fs2); drawGlyph(ctx,n-1,cx,cy+R*0.47,fs2*1.04);
    } else {
      var fsC=S*0.225, slots=[[0,-R*0.54],[-R*0.44,R*0.42],[R*0.44,R*0.42]], m3=n-1;
      ctx.font=F(fsC);
      for (var t=0;t<m3;t++) drawGlyph(ctx,t,cx+slots[t][0],cy+slots[t][1],fsC*1.04);
      var fsMid=S*0.30; ctx.font=F(fsMid); drawGlyph(ctx,n-1,cx,cy,fsMid*1.04);
    }
  }

  /* ---------- 日期章绘制 ---------- */
  function drawDateSquare(ctx, d, cx, cy, S){
    var parts = dateParts(d, state.dateFormat);
    var border = S*0.042, half=S/2, x0=cx-half, y0=cy-half;
    ctx.strokeStyle=state.color; ctx.fillStyle=state.color; ctx.lineJoin="miter";
    ctx.lineWidth=border;
    ctx.strokeRect(x0+border/2, y0+border/2, S-border, S-border);
    var fs=S*0.19;
    ctx.font=F(fs); ctx.textAlign="center"; ctx.textBaseline="middle";
    if (parts.length===2){
      ctx.fillText(parts[0], cx, y0+S*0.32);
      ctx.fillText(parts[1], cx, y0+S*0.68);
      ctx.lineWidth=border*0.35;
      ctx.beginPath();
      ctx.moveTo(x0+border*1.5, cy); ctx.lineTo(x0+S-border*1.5, cy);
      ctx.stroke();
    } else {
      ctx.fillText(parts[0], cx, cy);
    }
  }
  function drawDateRect(ctx, d, cx, cy, S){
    var text=dateText(d, state.dateFormat), chars=text.split(""), n=chars.length;
    var cs=S*0.21, slot=cs*1.22, border=S*0.05;
    var W=slot*n+border*2+S*0.05, H=cs+border*2+S*0.05;
    var x0=cx-W/2, y0=cy-H/2;
    ctx.strokeStyle=state.color; ctx.fillStyle=state.color; ctx.lineWidth=border;
    ctx.strokeRect(x0+border/2, y0+border/2, W-border, H-border);
    ctx.font=F(cs); ctx.textAlign="center"; ctx.textBaseline="middle";
    var innerL=x0+border, innerW=W-2*border;
    chars.forEach(function(ch,i){ ctx.fillText(ch, innerL+innerW*(i+0.5)/n, cy); });
  }
  function drawDateCircle(ctx, d, cx, cy, S){
    var text=dateText(d, state.dateFormat), chars=text.split(""), n=chars.length;
    var R=S/2, border=S*0.038;
    ctx.strokeStyle=state.color; ctx.fillStyle=state.color; ctx.lineWidth=border;
    ctx.beginPath(); ctx.arc(cx,cy,R-border/2,0,Math.PI*2); ctx.stroke();
    var fs=S*Math.min(0.135, 0.95/n);
    ctx.font=F(fs); ctx.textAlign="center"; ctx.textBaseline="middle";
    var rText=R*0.62;
    for (var i=0;i<n;i++){
      var th=-Math.PI/2 + (i/n)*Math.PI*2;
      ctx.fillText(chars[i], cx+Math.cos(th)*rText, cy+Math.sin(th)*rText);
    }
  }

  /* ---------- 做旧纹理 ---------- */
  function erode(cv){
    var ctx=cv.getContext("2d"), w=cv.width, h=cv.height;
    ctx.save(); ctx.globalCompositeOperation="destination-out";
    for (var i=0;i<420;i++){ var x=Math.random()*w,y=Math.random()*h,r=0.8+Math.random()*2.2; ctx.globalAlpha=0.08+Math.random()*0.3; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    for (var j=0;j<60;j++){ var a=Math.random()*Math.PI*2,rr=Math.min(w,h)/2-4,ex=w/2+Math.cos(a)*rr,ey=h/2+Math.sin(a)*rr; ctx.globalAlpha=0.15+Math.random()*0.25; ctx.beginPath(); ctx.arc(ex,ey,1.5+Math.random()*3,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }

  /* ---------- 渲染姓名章 ---------- */
  function makeNameSealCanvas(scale){
    var cv=document.createElement("canvas"), ctx=cv.getContext("2d");
    var S=440*scale, pad=20*scale, shape=state.nameShape;
    if (shape==="square" || shape==="circle"){
      cv.width=cv.height=S+pad;
      if (shape==="square") drawNameSquare(ctx, cv.width/2, cv.height/2, S);
      else drawNameCircle(ctx, cv.width/2, cv.height/2, S);
    } else {
      var m=nameRectMetrics(S);
      cv.width=m.w+pad; cv.height=m.h+pad;
      drawNameRect(ctx, cv.width/2, cv.height/2, S);
    }
    if (state.texture) erode(cv);
    return cv;
  }

  /* ---------- 渲染日期章 ---------- */
  function makeDateSealCanvas(scale){
    var cv=document.createElement("canvas"), ctx=cv.getContext("2d");
    var S=440*scale, pad=20*scale, shape=state.dateShape, text=dateText(state.date, state.dateFormat), n=text.length;
    if (shape==="square" || shape==="circle"){
      cv.width=cv.height=S+pad;
      if (shape==="square") drawDateSquare(ctx, state.date, cv.width/2, cv.height/2, S);
      else drawDateCircle(ctx, state.date, cv.width/2, cv.height/2, S);
    } else {
      var cs=S*0.21, slot=cs*1.22, border=S*0.05;
      var W=slot*n+border*2+S*0.05, H=cs+border*2+S*0.05;
      cv.width=W+pad; cv.height=H+pad;
      drawDateRect(ctx, state.date, cv.width/2, cv.height/2, S);
    }
    if (state.texture) erode(cv);
    return cv;
  }

  /* ---------- 预览 ---------- */
  var previewCv=document.getElementById("sealCanvas");
  var paperBox=document.getElementById("paperBox");
  function renderPreview(){
    var src, dw;
    if (state.mode==="name"){
      src=makeNameSealCanvas(1.1);
      if (state.nameShape==="square" || state.nameShape==="circle") dw=230;
      else if (state.nameLayout==="lay_rect_h") dw=280;
      else dw=150;
      document.getElementById("sigName").textContent=state.name || "无名";
      document.getElementById("sigName").style.fontFamily=state.font;
      document.getElementById("sigName").style.fontWeight=state.bold ? "bold" : "normal";
      paperBox.classList.remove("date-only");
    } else {
      src=makeDateSealCanvas(1.1);
      dw = state.dateShape==="rect" ? 320 : 240;
      paperBox.classList.add("date-only");
    }
    previewCv.width=src.width; previewCv.height=src.height;
    previewCv.style.width=dw+"px";
    previewCv.getContext("2d").drawImage(src,0,0);
  }

  /* ---------- 姓名顺序 chips ---------- */
  function renderOrderChips(){
    var box=document.getElementById("orderChips"); box.innerHTML="";
    state.order.forEach(function(ch,i){
      var chip=document.createElement("div"); chip.className="chip";
      var idx=document.createElement("span"); idx.className="idx"; idx.textContent=i+1;
      var span=document.createElement("span"); span.className="ch"; span.textContent=ch;
      var btns=document.createElement("span"); btns.className="btns";
      var up=document.createElement("button"); up.textContent="▲"; up.disabled=(i===0);
      var down=document.createElement("button"); down.textContent="▼"; down.disabled=(i===state.order.length-1);
      up.onclick=function(){ swapOrder(i,i-1); };
      down.onclick=function(){ swapOrder(i,i+1); };
      btns.appendChild(up); btns.appendChild(down);
      chip.appendChild(idx); chip.appendChild(span); chip.appendChild(btns);
      box.appendChild(chip);
    });
    padLabels();
  }
  function swapOrder(a,b){ var t=state.order[a]; state.order[a]=state.order[b]; state.order[b]=t; renderOrderChips(); renderPreview(); }

  /* ---------- 手写格 ---------- */
  function buildPads(){
    var box=document.getElementById("padBox"); box.innerHTML="";
    for (var i=0;i<4;i++){
      (function(i){
        var item=document.createElement("div"); item.className="pad-item";
        var cv=document.createElement("canvas"); cv.width=PAD; cv.height=PAD;
        var lbl=document.createElement("div"); lbl.className="lbl";
        var cspan=document.createElement("span"); cspan.className="c"; cspan.textContent=state.order[i] || "";
        var clr=document.createElement("button"); clr.textContent="清空";
        clr.onclick=function(){ state.strokes[i]=[]; redrawPad(i); renderPreview(); };
        lbl.appendChild(cspan); lbl.appendChild(clr);
        item.appendChild(cv); item.appendChild(lbl);
        box.appendChild(item);
        bindPad(cv,i); redrawPad(i);
      })(i);
    }
  }
  function padLabels(){ var els=document.querySelectorAll("#padBox .pad-item .lbl .c"); for (var i=0;i<els.length;i++) els[i].textContent=state.order[i] || ""; }
  function padCanvas(idx){ return document.querySelectorAll("#padBox canvas")[idx]; }
  function bindPad(cv,idx){
    var drawing=false, cur=null;
    function pt(e){ var r=cv.getBoundingClientRect(); return { x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)), y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)) }; }
    cv.addEventListener("pointerdown",function(e){ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(err){} drawing=true; cur=[pt(e)]; state.strokes[idx].push(cur); redrawPad(idx); renderPreview(); });
    cv.addEventListener("pointermove",function(e){ if(!drawing||!cur)return; e.preventDefault(); cur.push(pt(e)); redrawPad(idx); renderPreview(); });
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){ cv.addEventListener(ev,function(){ drawing=false; cur=null; }); });
  }
  function redrawPad(idx){ var cv=padCanvas(idx); if(!cv)return; var ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height); ctx.save(); ctx.strokeStyle=state.color; ctx.fillStyle=state.color; ctx.lineWidth=PAD*0.055; ctx.lineCap="round"; ctx.lineJoin="round"; (state.strokes[idx]||[]).forEach(function(st){ if(st.length===1){ ctx.beginPath(); ctx.arc(st[0].x*PAD,st[0].y*PAD,ctx.lineWidth*0.5,0,Math.PI*2); ctx.fill(); return; } ctx.beginPath(); ctx.moveTo(st[0].x*PAD,st[0].y*PAD); for(var k=1;k<st.length;k++) ctx.lineTo(st[k].x*PAD,st[k].y*PAD); ctx.stroke(); }); ctx.restore(); }
  function redrawAllPads(){ for(var i=0;i<4;i++) redrawPad(i); }

  /* ---------- 布局下拉 ---------- */
  var layoutSelect=document.getElementById("layoutSelect");
  function fillLayoutOptions(){
    layoutSelect.innerHTML="";
    NAME_LAYOUTS[state.nameShape].forEach(function(item){ var opt=document.createElement("option"); opt.value=item[0]; opt.textContent=item[1]; layoutSelect.appendChild(opt); });
    state.nameLayout=NAME_LAYOUTS[state.nameShape][0][0];
  }

  /* ---------- 下载 ---------- */
  function download(cv, filename){ var a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download=filename; a.click(); }

  document.getElementById("dlSeal").addEventListener("click",function(){ download(makeNameSealCanvas(3), "姓名章_"+(state.name||"无名")+".png"); });
  document.getElementById("dlDateSeal").addEventListener("click",function(){ var txt=dateText(state.date,state.dateFormat).replace(/[年月日.]/g,"_"); download(makeDateSealCanvas(3), "日期章_"+txt+".png"); });
  document.getElementById("dlCard").addEventListener("click",function(){
    var scale=2, W=700*scale, H=440*scale, cv=document.createElement("canvas");
    cv.width=W; cv.height=H; var ctx=cv.getContext("2d");
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#1a1a1a"; ctx.font=F(Math.round(58*scale)); ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillText(state.name||"无名", 70*scale, 200*scale);
    ctx.strokeStyle="#999"; ctx.lineWidth=1.2*scale; ctx.beginPath(); ctx.moveTo(66*scale,225*scale); ctx.lineTo(320*scale,225*scale); ctx.stroke();
    var d=new Date(); ctx.fillStyle="#555"; ctx.font=Math.round(16*scale)+"px "+state.font;
    ctx.fillText(d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月 "+d.getDate()+" 日", 70*scale, 260*scale);
    var seal=makeNameSealCanvas(scale*0.9);
    var sh=Math.min(seal.height,230*scale), sw=seal.width*(sh/seal.height);
    ctx.drawImage(seal, W-sw-60*scale, H-sh-50*scale, sw, sh);
    download(cv, "签字盖章卡_"+(state.name||"无名")+".png");
  });

  /* ---------- 交互绑定 ---------- */
  var tabs=document.querySelectorAll(".tab");
  tabs.forEach(function(tab){ tab.addEventListener("click",function(){ tabs.forEach(function(t){ t.classList.remove("active"); }); tab.classList.add("active"); state.mode=tab.dataset.mode; document.body.classList.toggle("date-mode", state.mode==="date"); updateActiveShapeBtns(); renderPreview(); }); });

  document.getElementById("nameInput").addEventListener("input",function(e){ state.name=e.target.value; rebuildOrder(); renderOrderChips(); renderPreview(); });

  function shapeClick(group, isName){ var btns=document.querySelectorAll(group+" .shape-btn"); btns.forEach(function(btn){ btn.addEventListener("click",function(){ btns.forEach(function(b){ b.classList.remove("active"); }); btn.classList.add("active"); if (isName){ state.nameShape=btn.dataset.shape; fillLayoutOptions(); } else { state.dateShape=btn.dataset.shape; } renderPreview(); }); }); }
  shapeClick("#shapeBtns", true);
  shapeClick("#dateShapeBtns", false);

  function updateActiveShapeBtns(){
    document.querySelectorAll("#shapeBtns .shape-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.shape===state.nameShape); });
    document.querySelectorAll("#dateShapeBtns .shape-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.shape===state.dateShape); });
  }

  layoutSelect.addEventListener("change",function(e){ state.nameLayout=e.target.value; renderPreview(); });

  document.getElementById("fontSelect").addEventListener("change",function(e){ var v=e.target.value; if (v==="hand"){ state.hand=true; document.getElementById("padGroup").style.display="block"; } else { state.hand=false; state.font=FONTS[v]; document.getElementById("padGroup").style.display="none"; } renderPreview(); });
  document.getElementById("clearAllPads").addEventListener("click",function(){ state.strokes=[[],[],[],[]]; redrawAllPads(); renderPreview(); });

  var dateInput=document.getElementById("dateInput");
  dateInput.valueAsDate=state.date;
  dateInput.addEventListener("change",function(e){ if(e.target.value){ state.date=new Date(e.target.value+"T00:00:00"); renderPreview(); } });
  document.querySelectorAll("input[name='dateFmt']").forEach(function(r){ r.addEventListener("change",function(e){ if(e.target.checked){ state.dateFormat=e.target.value; renderPreview(); } }); });

  var swatchEls=document.querySelectorAll(".swatch");
  swatchEls.forEach(function(sw){ sw.addEventListener("click",function(){ swatchEls.forEach(function(s){ s.classList.remove("active"); }); sw.classList.add("active"); state.color=sw.dataset.color; document.getElementById("customColor").value=sw.dataset.color; redrawAllPads(); renderPreview(); }); });
  document.getElementById("customColor").addEventListener("input",function(e){ swatchEls.forEach(function(s){ s.classList.remove("active"); }); state.color=e.target.value; redrawAllPads(); renderPreview(); });
  document.getElementById("textureChk").addEventListener("change",function(e){ state.texture=e.target.checked; renderPreview(); });
  document.getElementById("boldChk").addEventListener("change",function(e){ state.bold=e.target.checked; renderPreview(); });

  /* ---------- 初始化 ---------- */
  var now=new Date();
  document.getElementById("sigDate").textContent=now.getFullYear()+" 年 "+(now.getMonth()+1)+" 月 "+now.getDate()+" 日";
  fillLayoutOptions();
  buildPads();
  renderOrderChips();
  updateActiveShapeBtns();
  renderPreview();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
