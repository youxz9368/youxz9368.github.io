  happy:()=>`<g class="eye" fill="none" stroke="#2a2017" stroke-width="4" stroke-linecap="round"><path d="M60 100 Q74 84 88 100"/><path d="M112 100 Q126 84 140 100"/></g>`,
  sleep:()=>`<g class="eye" fill="none" stroke="#2a2017" stroke-width="4" stroke-linecap="round"><path d="M62 102 Q74 110 86 102"/><path d="M114 102 Q126 110 138 102"/></g>`,
  love:()=>`<g class="eye" fill="var(--bad)" stroke="none"><path d="M74 92 c-7 -10 -22 -3 -22 7 c0 9 16 16 22 22 c6 -6 22 -13 22 -22 c0 -10 -15 -17 -22 -7 z" transform="translate(0,2)"/><path d="M126 92 c-7 -10 -22 -3 -22 7 c0 9 16 16 22 22 c6 -6 22 -13 22 -22 c0 -10 -15 -17 -22 -7 z" transform="translate(0,2)"/></g>`,
  surprise:()=>`<g class="eye"><ellipse cx="74" cy="98" rx="17" ry="20" fill="#fff" stroke="#3a2c1a" stroke-width="2"/><ellipse cx="126" cy="98" rx="17" ry="20" fill="#fff" stroke="#3a2c1a" stroke-width="2"/><circle cx="74" cy="100" r="6" fill="#2a2017"/><circle cx="126" cy="100" r="6" fill="#2a2017"/></g>`
};
const MOUTH = {
  smile:'<path d="M82 132 Q100 150 118 132" fill="none" stroke="#3a2c1a" stroke-width="4" stroke-linecap="round"/>',
  big:'<path d="M76 130 Q100 158 124 130 Q100 144 76 130 Z" fill="#b5443a"/>',
  flat:'<path d="M84 136 Q100 140 116 136" fill="none" stroke="#3a2c1a" stroke-width="4" stroke-linecap="round"/>',
  frown:'<path d="M82 142 Q100 126 118 142" fill="none" stroke="#3a2c1a" stroke-width="4" stroke-linecap="round"/>',
  o:'<ellipse cx="100" cy="138" rx="9" ry="11" fill="#b5443a"/>',
  sleep:'<path d="M88 138 Q100 143 112 138" fill="none" stroke="#3a2c1a" stroke-width="4" stroke-linecap="round"/>'
};
function moodOf(){
  const p=P();
  if(p.eng<18) return 'sleepy';
  if(p.full<22) return 'hungry';
  if(p.mood<25) return 'sad';
  if(p.bond>80 && Math.random()<0.4) return 'love';
  return 'normal';
}
const MOOD_FACE = {
  normal:{eye:'open',mouth:'smile',color:'var(--acc)'},
  happy:{eye:'happy',mouth:'big',color:'var(--ok)'},
  hungry:{eye:'open',mouth:'flat',color:'var(--warn)'},
  sad:{eye:'open',mouth:'frown',color:'var(--bad)'},
  sleepy:{eye:'sleep',mouth:'sleep',color:'#9b8466'},
  love:{eye:'love',mouth:'smile',color:'var(--bad)'},
  surprise:{eye:'surprise',mouth:'o',color:'var(--acc)'}
};
let gaze=0, blinkTimer=null, gazeTimer=null, faceTimer=null;
function drawFace(force){
  const m = force || moodOf();
  const f = MOOD_FACE[m] || MOOD_FACE.normal;
  $('#eyes').innerHTML = (EYE[f.eye]||EYE.open)(gaze);
  $('#mouth').innerHTML = MOUTH[f.mouth] || MOUTH.smile;
  $('#mouth').setAttribute('transform', G.cur==='zhu' ? 'translate(0,12)' : '');
  $$('.accent').forEach(el=>el.setAttribute('fill', f.color));
  const pet=$('#pet'); pet.classList.remove('happy','sad','sleep');
  if(m==='happy') pet.classList.add('happy');
  else if(m==='sad') pet.classList.add('sad');
  else if(m==='sleepy') pet.classList.add('sleep');
  $('#zzz1').classList.toggle('go', m==='sleepy');
  $('#zzz2').classList.toggle('go', m==='sleepy');
  const blush = (m==='happy'||m==='love') ? .42 : (m==='sad'? .12 : .26);
  const cl=$('#cheekL'), cr=$('#cheekR'); if(cl) cl.setAttribute('opacity',blush); if(cr) cr.setAttribute('opacity',blush);
}
function blink(){ const e=$('#eyes'); if(!e) return; e.classList.add('blink'); setTimeout(()=>e.classList.remove('blink'),150); }
function startFaceLife(){ clearInterval(blinkTimer); clearInterval(gazeTimer); clearInterval(faceTimer);
  blinkTimer=setInterval(()=>{ if(Math.random()<0.7) blink(); },3200);
  gazeTimer=setInterval(()=>{ gaze=pick([-3,0,0,3]); drawFace(); },2600);
  faceTimer=setInterval(()=>drawFace(),9000);
}

/* ============ 状态条 ============ */
function barColor(v){ return v>60?'var(--ok)':v>25?'var(--warn)':'var(--bad)'; }
function render(){
  const p=P();
  [['Full',p.full],['Mood',p.mood],['Eng',p.eng],['Bond',p.bond]].forEach(([k,v])=>{
    $('#b'+k).style.width=clamp(v,0,100)+'%';
    $('#b'+k).style.background=barColor(v);
    $('#v'+k).textContent=Math.round(v);
  });
  const days=Math.max(0,Math.floor((Date.now()-p.born)/86400000));
  const hrs=Math.floor((Date.now()-p.born)/3600000);
  $('#ageLine').innerHTML=`<span>🎂 陪你 <b>${days}</b> 天</span><span>⏱ 出生 <b>${hrs}</b> 小时前</span><span>🍙 已饲 <b>${p.fed}</b> 餐</span><span>🏆 拍蝇最高 <b>${p.playBest}</b></span>`;

/* ============ 动作 ============ */
function beep(freq,dur,type){
  if(!G.sound) return;
  try{
    const ac=beep._ac||(beep._ac=new (window.AudioContext||window.webkitAudioContext)());
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(dur||.18));
    o.start(); o.stop(ac.currentTime+(dur||.18)+.02);
  }catch(e){}
}
function action(act){
  const p=P();
  if(act==='feed'){ p.full=clamp(p.full+22,0,100); p.mood=clamp(p.mood+6,0,100); p.fed++; drawFace('happy'); say('feed'); beep(660,.12); burst(14); }
  else if(act==='pet'){ p.bond=clamp(p.bond+5,0,100); p.mood=clamp(p.mood+3,0,100); G.petStreak=(G.petStreak||0)+1; drawFace(G.petStreak>=4?'love':'happy'); say('pet'); beep(880,.1); if(G.petStreak>=4){ burst(18); G.petStreak=0; } }
  else if(act==='play'){ p.mood=clamp(p.mood+16,0,100); p.eng=clamp(p.eng-8,0,100); p.bond=clamp(p.bond+3,0,100); drawFace('happy'); say('play'); beep(520,.1,'triangle'); burst(10); }
  else if(act==='sleep'){ p.eng=clamp(p.eng+30,0,100); p.mood=clamp(p.mood+4,0,100); drawFace('sleepy'); say('sleep'); beep(330,.25,'sine'); }
  setTimeout(()=>drawFace(),1400); save(); render();
}

/* ============ 时间流逝 ============ */
function tick(){
  const p=P(); const now=Date.now(), dt=Math.max(0, now-(p.last||now)); const mins=dt/60000;
  p.full=clamp(p.full-Math.min(mins*0.18,40),0,100);
  p.eng=clamp(p.eng-Math.min(mins*0.10,30),0,100);
  p.mood=clamp(p.mood-Math.min(mins*0.06,25),0,100);
  render();
  const m=moodOf();
  if(m==='hungry'&&Math.random()<0.5) say('hungry');
  else if(m==='sad'&&Math.random()<0.4) say('sad');
  else if(m==='sleepy'&&Math.random()<0.3) say('sleepy');
  else if(Math.random()<0.12) say('happy');
}

/* ============ 粒子 ============ */
const fx=$('#fx'); const fxc=fx.getContext('2d'); let parts=[];
function resizeFx(){ fx.width=innerWidth; fx.height=innerHeight; }
addEventListener('resize',resizeFx); resizeFx();
function burst(n){
  const rect=$('#pet').getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const cols=['#ff8a5b','#ffc24b','#46c08a','#6aa9ff','#ff6f9c','#b48bff'];
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=rnd(2,7);
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(1,4),life:1,col:pick(cols),sz:rnd(4,9),rot:Math.random()*6,vr:rnd(-.3,.3)}); }
}
function fxLoop(){ fxc.clearRect(0,0,fx.width,fx.height); parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.18; p.vx*=.99; p.life-=.018; p.rot+=p.vr;
    fxc.save(); fxc.translate(p.x,p.y); fxc.rotate(p.rot); fxc.globalAlpha=Math.max(0,p.life); fxc.fillStyle=p.col; fxc.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*0.6); fxc.restore(); });
  requestAnimationFrame(fxLoop); }
fxLoop();

/* ============ 背景球 ============ */
const bg=$('#bg'); const bgc=bg.getContext('2d'); let blobs=[];
function resizeBg(){ bg.width=innerWidth; bg.height=innerHeight; }
addEventListener('resize',resizeBg); resizeBg();
for(let i=0;i<14;i++) blobs.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:rnd(6,22),vy:rnd(.2,.7),vx:rnd(-.3,.3),a:rnd(.05,.16)});
function bgLoop(){ bgc.clearRect(0,0,bg.width,bg.height); const dark=document.documentElement.getAttribute('data-theme')==='dark';
  blobs.forEach(b=>{ b.y-=b.vy; b.x+=b.vx; if(b.y<-30){b.y=bg.height+30; b.x=Math.random()*bg.width;}
    bgc.beginPath(); bgc.arc(b.x,b.y,b.r,0,Math.PI*2); bgc.fillStyle=dark?`rgba(255,220,150,${b.a})`:`rgba(255,160,80,${b.a})`; bgc.fill(); });
  requestAnimationFrame(bgLoop); }
bgLoop();

  {p:"金柑一粒甜到心，欢喜自然来。",e:"今天心情会很好，享受就好。"}
];
function drawFortune(){ const f=pick(FORTUNE); $('#fortunePoem').textContent=f.p; $('#fortuneEx').textContent=f.e; say('happy'); beep(700,.12); burst(8); }

/* ============ 拍苍蝇 ============ */
let miniScore=0, miniTimer=null, miniActive=false; const taparea=$('#taparea');
function spawnFly(){ if(!miniActive) return; taparea.querySelectorAll('.tgt').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='tgt'; t.textContent=pick(['🪰','🐝','🦟']);
  t.style.left=rnd(6,taparea.clientWidth-52)+'px'; t.style.top=rnd(6,taparea.clientHeight-52)+'px';
  let alive=true;
  t.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(!alive) return; alive=false;
    miniScore++; const p=P(); p.bond=clamp(p.bond+1,0,100); p.mood=clamp(p.mood+1,0,100);
    $('#miniScore').textContent=miniScore+' 分'; t.style.transform='scale(0)'; t.remove(); beep(900+rnd(0,200),.06,'square');
    if(miniScore>p.playBest) p.playBest=miniScore; save(); render(); });
  taparea.appendChild(t);
  miniTimer=setTimeout(()=>{ if(alive) t.remove(); spawnFly(); }, rnd(900,1500)); }
taparea.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('tgt')) return;
  if(miniScore>0){ P().bond=clamp(P().bond-1,0,100); save(); render(); } miniScore=0; $('#miniScore').textContent='0 分'; });
function miniStart(){ if(miniActive) return; miniActive=true; miniScore=0; spawnFly();
  setTimeout(()=>{ miniActive=false; clearTimeout(miniTimer); taparea.querySelectorAll('.tgt').forEach(t=>t.remove());
    showBubble(miniScore>5?`足好耍！拍著 ${miniScore} 只`:'阁练习一下嘛'); },20000); }

/* ============ 聊天机器人 小答 ============ */
function botReply(t){
  t=(t||'').toLowerCase();
  const has=(...ks)=>ks.some(k=>t.includes(k));
  if(has('早','morning','起床')) return pick(['早安喔～今仔日精神否？','天光饱饱，欲食啥物早餐？','早啊，阿福佮珠珠犹咧困']);
  if(has('晚安','困','休息','睡','暗眠')) return pick(['晚安～你爱顾身体，困饱饱','好困就困，明仔载阁陪你','困饱饱，梦着好料']);
  if(has('你好','嗨','哈啦','hi','hello','在吗','在唔','在不在')) return pick(['嗨！我是小答，欲佮我讲啥？','你好啊～今仔日想欲聊啥物？','哼哼，我伫这啦']);
  if(has('闽南','台语','方言','怎样说','怎么讲','教我')) return pick(['教你看一句：「食饱未？」是问你食饭了未','闽南话「枵」就是饿，「畅」就是开心','想学闽南话，讲一个词互我，我教你讲','「恁仔喂」是「喂」的亲切叫法，欲试看看无？']);
  if(has('阿福','珠珠','猪','宠物','饲','萌')) return pick(['阿福佮珠珠是咱家己养的，你摸伊嘛欢喜','珠珠足枵，紧去饲伊','阿福这马佇遐蹦蹦跳，你看嘛','两只我都佮意，你爱饲啥只？']);
  if(has('心情','难过','烦','郁闷','累','压力','哭','无采工')) return pick(['免烦恼啦，事情慢慢做就有','一句老话：「船过水无痕」，放宽心','我陪你，讲予我听啥物事','深呼吸一下，魏欸']);
  if(has('笑话','好玩','笑','趣味','梗')) return pick(['知影無？珠珠讲伊上盖水，因为伊是「珠」珠😄','阿福身份证欲写「精灵」两个字','听讲阿福佮珠珠咧相借问：今仔日欲食啥']);
  if(has('签','运势','运气','顺')) return pick(FORTUNE.map(f=>f.p+' — '+f.e));
  if(has('饿','枵','食','饭','呷','泔糜','料')) return pick(['枵就紧去食，勿体滇滇','欲食啥？我共你讲一款泉州的','食饱未？这是上闽南的关心']);
  if(has('谢谢','多谢','感恩','感激')) return pick(['免客气啦～','感恩你','应该的，阁欲聊啥']);
  if(has('名字','你谁','你是','称呼','叫啥')) return pick(['我是小答，阿福佮珠珠的伴','我叫小答，陪你闲聊个','我是你的小聊天伙计']);
  if(has('拜拜','再见','走了','掰','离开')) return pick(['拜拜～紧去饲阿福','下摆阁来聊，爱顾身体','再见啦，珠珠欲想你']);
  if(has('爱','喜欢','欢喜','宝贝')) return pick(['我嘛欢喜陪你','咱做伙足好','你讲这，我足开心']);
  if(has('电脑','软件','写','程式','code','代码','app','程序')) return pick(['写软件真趣味，一步一步来就好','你那几款软件我拢知影，阿福看诚多项','欲做啥软件，讲予我听，我替你想']);
  const fb=['唔知你讲啥，但是我佮意听你讲','继续讲，我伫这','呵，你真趣味','你想欲聊啥？我陪你','这句话我记咧，阁讲多一絮','哼，你讲啥我拢听'];
  return pick(fb);
}
function pushMsg(who,text){ G.chat.push({who,text,t:Date.now()}); if(G.chat.length>200) G.chat.shift(); save(); renderChat(); scrollChat(); }
function renderChat(){
  const box=$('#chatMsgs'); if(!box) return;
  if(!G.chat.length){ box.innerHTML='<div class="msg bot">嗨！我是小答 💬 陪你闲聊、教闽南话、讲笑佮抽签。欲先讲啥？</div>'; return; }
  box.innerHTML=G.chat.map(m=>`<div class="msg ${m.who}">${esc(m.text)}</div>`).join('');
}
function scrollChat(){ const box=$('#chatMsgs'); if(box) box.scrollTop=box.scrollHeight; }
function chatSend(){
  const v=$('#chatText').value.trim(); if(!v) return;
  $('#chatText').value=''; pushMsg('me',v);
  const tEl=document.createElement('div'); tEl.className='typing'; tEl.innerHTML='小答 佇输入 <i></i><i></i><i></i>';
  $('#chatMsgs').appendChild(tEl); scrollChat();
  setTimeout(()=>{ tEl.remove(); pushMsg('bot', botReply(v)); }, 480+Math.random()*520);
}

/* ============ 视图 / 主题 / 设置 ============ */
function applyTheme(){ document.documentElement.setAttribute('data-theme',G.theme); $('#btnTheme').textContent=G.theme==='dark'?'☀️':'🌙'; }
function toggleTheme(){ G.theme=G.theme==='dark'?'light':'dark'; applyTheme(); save(); }
function applySound(){ $('#btnSound').classList.toggle('on',G.sound); $('#btnSound').textContent=G.sound?'开':'关'; }
function setView(v){
  G.view=v;
  $('#petView').style.display = v==='pet'?'':'none';
  $('#chatView').style.display = v==='chat'?'block':'none';
  $('#petswitch').style.display = v==='pet'?'flex':'none';
  $('#petName').textContent = v==='chat' ? '小答 · 聊天' : (PETS[G.cur].name+' '+PETS[G.cur].emoji+' 你的小宝贝');
  $('#btnChat').textContent = v==='chat' ? '🐾' : '💬';
  if(v==='chat'){ renderChat(); scrollChat(); } save();
}
function switchPet(id){
  if(!PETS[id]) return; G.cur=id; setSpecies(); drawFace(); render();
  $$('#petswitch button').forEach(b=>b.classList.toggle('on', b.dataset.pet===id));
  $('#petName').textContent = PETS[id].name+' '+PETS[id].emoji+' 你的小宝贝';
  save();
}
let toastT=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function reset(){
  if(!confirm('欲重新养老一只 '+PETS[G.cur].name+'？旧个会走矣（资料清掉）。')) return;
  G.pets[G.cur]=freshPet(G.cur==='zhu'?{full:90,mood:80,eng:80,bond:20}:{});
  save(); setSpecies(); drawFace('happy'); render(); say('born'); toast('新的一只 '+PETS[G.cur].name+' 出世啰 🐣'); burst(26);
}

/* ============ 事件 ============ */
$('#pet').addEventListener('click',()=>{ const p=P(); p.bond=clamp(p.bond+1,0,100); drawFace(p.bond>80?'love':'happy'); say(pick(['pet','happy'])); beep(760,.08); save(); render(); });
$$('.act').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act)));
$$('#petswitch button').forEach(b=>b.addEventListener('click',()=>switchPet(b.dataset.pet)));
$('#btnChat').addEventListener('click',()=>setView(G.view==='chat'?'pet':'chat'));
$('#btnTheme').addEventListener('click',toggleTheme);
$('#btnTheme2').addEventListener('click',toggleTheme);
$('#btnSound').addEventListener('click',()=>{ G.sound=!G.sound; applySound(); save(); beep(600,.1); });
$('#btnSave').addEventListener('click',()=>{ save(); toast('存好矣 💾'); });
$('#btnReset').addEventListener('click',reset);
$('#btnFortune').addEventListener('click',drawFortune);
$('#chatClear').addEventListener('click',()=>{ G.chat=[]; save(); renderChat(); toast('聊天主清矣'); });
$('#chatSend').addEventListener('click',chatSend);
$('#chatText').addEventListener('keydown',e=>{ if(e.key==='Enter') chatSend(); });
$('#miniScore').parentElement.addEventListener('click',miniStart);

/* ============ 启动 ============ */
function boot(){
  applyTheme(); applySound(); setSpecies(); setView(G.view);
  const firstTime = !hadG;
  if(firstTime){ drawFace('happy'); say('born'); burst(20); }
  else {
    const away=Date.now()-(P().last||Date.now()); drawFace();
    if(away>3600000){ say('back'); burst(10); } else { setTimeout(()=>say('happy'),600); }
  }
  tick(); setInterval(tick,15000); startFaceLife(); save();
}
boot();
